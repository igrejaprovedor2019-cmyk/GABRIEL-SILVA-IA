<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prêmio Roblox</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* FUNDO */

body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;

    background:
    linear-gradient(rgba(0,0,0,0.68), rgba(0,0,0,0.68)),
    url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9A_o3mMEct7X8BsAJ08YB5O0wbDlbgSV1nw&s');

    background-size:cover;
    background-position:center;

    filter:blur(8px);
    transform:scale(1.1);

    z-index:-2;
}

/* INTRO */

.intro{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    background:rgba(0,0,0,0.80);

    backdrop-filter:blur(12px);

    z-index:50;

    transition:1s;
}

.intro.hidden{
    opacity:0;
    visibility:hidden;
}

/* TITULO INTRO */

.intro h1{
    color:white;
    font-size:58px;
    letter-spacing:4px;
    margin-bottom:30px;
}

/* LINHAS */

.reward{
    width:320px;

    padding:15px;

    margin:10px 0;

    border-radius:16px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    color:#e3e3e3;

    text-align:center;

    font-size:18px;

    backdrop-filter:blur(10px);
}

/* TEXTO */

.click{
    margin-top:35px;
    color:#bdbdbd;
    font-size:15px;
    letter-spacing:2px;
}

/* PAINEL */

.panel{
    width:430px;

    background:rgba(60,60,60,0.35);

    backdrop-filter:blur(18px);

    border-radius:28px;

    padding:35px;

    border:1px solid rgba(255,255,255,0.12);

    box-shadow:
    0 0 35px rgba(0,0,0,0.5),
    inset 0 0 20px rgba(255,255,255,0.03);
}

/* LOGO */

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:150px;
    height:150px;

    object-fit:cover;

    border-radius:50%;

    border:4px solid rgba(255,255,255,0.18);

    box-shadow:0 0 25px rgba(0,0,0,0.5);
}

/* TITULO */

.title{
    text-align:center;

    color:white;

    font-size:34px;

    font-weight:bold;

    margin-bottom:15px;

    padding:12px;

    border-radius:18px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,0.08);
}

/* TEXTO */

.desc{
    text-align:center;
    color:#dcdcdc;
    margin-bottom:28px;
    font-size:15px;
}

/* INPUT */

.input-box{
    width:100%;
    margin-bottom:18px;
}

.input-box input{
    width:100%;

    padding:16px;

    border:none;

    border-radius:18px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(10px);

    color:white;

    font-size:15px;

    outline:none;

    border:1px solid rgba(255,255,255,0.06);
}

.input-box input::placeholder{
    color:#d0d0d0;
}

/* BOTAO */

.btn{
    width:100%;

    padding:16px;

    border:none;

    border-radius:18px;

    background:#00b06b;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

.btn:hover{
    background:#00d47f;
    transform:scale(1.03);
}

/* INFO */

.info{
    margin-top:20px;
    text-align:center;
    color:#c4c4c4;
    font-size:13px;
}

</style>
</head>

<body>

<!-- INTRO -->

<div class="intro" id="intro">

    <h1>PRÊMIOS</h1>

    <div class="reward">
        ROBUX GRÁTIS
    </div>

    <div class="reward">
        FRUTAS PERMANENTES
    </div>

    <div class="reward">
        RECOMPENSAS EXCLUSIVAS
    </div>

    <div class="click">
        TOQUE NA TELA
    </div>

</div>
